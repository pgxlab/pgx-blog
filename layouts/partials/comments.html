{{- with site.Params.giscus }}{{ if and .repoID .categoryID }}
<div class="giscus" style="margin-top:2rem"></div>
<script src="https://giscus.app/client.js"
  data-repo="{{ .repo }}" data-repo-id="{{ .repoID }}"
  data-category="{{ .category }}" data-category-id="{{ .categoryID }}"
  data-mapping="pathname" data-strict="1" data-reactions-enabled="1"
  data-emit-metadata="0" data-input-position="bottom"
  data-theme="preferred_color_scheme" data-lang="ko" data-loading="lazy"
  crossorigin="anonymous" async></script>
{{- end }}{{ end }}
